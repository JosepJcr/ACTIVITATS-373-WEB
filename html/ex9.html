<!-- Descripció:
Els formularis són la manera en què els usuaris poden interactuar amb un lloc web. 
Imagina que estàs creant la pàgina de contacte del teu web. Necessites un formulari on els usuaris puguin introduir el seu nom, 
correu electrònic i un missatge per posar-se en contacte amb tu.

Objectiu:
Aprendre a crear un formulari HTML5 bàsic amb diferents tipus d’entrades: camps de text, correu electrònic i àrea de text, utilitzant etiquetes com <form>, 
<input>, i <textarea>.

Pistes:
Pots fer servir els atributs de placeholders per donar pistes a l’usuari sobre el que ha d’escriure en cada camp, 
com ara "Escriu el teu nom" o "Escriu el teu correu electrònic". -->
<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EX9 </title>
</head>
<body>
<form action="mailto:" method="post" enctype="text/plain">
  <label for="name">Nom:</label><br>
  <input type="text" id="name" name="name" placeholder="Escriu el teu nom"><br><br>
  
  <label for="email">Correu electrònic:</label><br>
  <input type="email" id="email" name="email" placeholder="Escriu el teu correu electrònic"><br><br>
  
  <label for="message">Missatge:</label><br>
  <textarea id="message" name="message" rows="4" cols="50" placeholder="Escriu el teu missatge"></textarea><br><br>
  
  <input type="submit" value="Enviar">
</div>
</body>
</html>
