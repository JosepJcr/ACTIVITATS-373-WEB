<!-- Descripció:
Utilitza etiquetes semàntiques per estructurar correctament una pàgina web. Imagina que tens una web d'articles. Necessites etiquetar correctament cada secció: el títol principal, una capçalera d'articles, el contingut principal i una secció de contacte al final.
Objectiu:
Fes servir etiquetes HTML5 com <header>, <article>, <section>, <footer>, etc., per donar estructura i significat semàntic a una pàgina web.
Pistes:
Fes que sigui creatiu! Per què no dissenyes una web fictícia sobre el teu esport o pel·lícula preferida? Això ho farà més divertit! -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> EXERCICI 2 JOSEP</title>
    
</head>
<header>
    <h1>Pelicula Preferida: Joker</h1>
</header>
<body>
    <section>
        <article>
            <h2>Resum de la Pel·lícula</h2>
            <p>Joker és una pel·lícula que explora l'origen del famós vilà de Batman, centrant-se en la vida d'Arthur Fleck, un home marginat per la societat que es converteix en el Joker.</p>
        </article>
        <article>
            <h2>Personatges Principals</h2>
            <ul>
                <li>Arthur Fleck / Joker</li>
            </ul>
        </article>
</body>
</html>
